<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Papá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Fondo oscuro inicial */
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            transition: background-color 2s ease;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Deja pasar clicks al 3D si es necesario */
            z-index: 10;
        }

        .text-panel {
            background: #fdfaf6; /* Color de papel cálido */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
            border: 1px solid #d6d3d1;
            border-radius: 4px; /* Bordes más rectos, como una hoja de papel */
            padding: 3.5rem 4.5rem;
            max-width: 800px;
            width: 90%;
            text-align: justify; /* Párrafos justificados como en las cartas */
            opacity: 0;
            transform: translateY(30px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(0,0,0,0.03);
            pointer-events: auto; /* Permite interacción con este elemento */
            position: relative;
        }

        /* Detalle de cinta o doblez opcional */
        .text-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 1px;
            background: rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive; /* Letra manuscrita para títulos */
            font-size: 3.5rem;
            color: #1c1917; /* Color tinta oscura */
            margin-bottom: 1.5rem;
            text-shadow: none;
            border-bottom: 1px solid #e7e5e4;
            padding-bottom: 10px;
            text-align: center;
        }

        p {
            font-family: 'Playfair Display', serif; /* Fuente serif clásica y elegante */
            font-size: 1.25rem;
            line-height: 1.9;
            margin-bottom: 1.5rem;
            color: #292524; /* Color de tinta oscura */
        }

        .highlight {
            color: #991b1b; /* Rojo oscuro elegante para resaltar */
            font-weight: 700;
            font-style: italic;
        }

        #controls {
            position: absolute;
            bottom: 2rem;
            display: flex;
            gap: 1rem;
            pointer-events: auto;
            z-index: 20;
        }

        button {
            background: transparent;
            color: #fdfaf6;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 0.8rem 2rem;
            border-radius: 4px; /* Combinar con el estilo de la carta */
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            box-shadow: none;
        }

        button:hover {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: transparent;
            border-color: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
            transform: none;
            opacity: 1;
        }

        .progress-dots {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15); /* Puntos más sutiles en el papel */
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #991b1b; /* Punto rojo que coincide con el highlight */
            transform: scale(1.3);
            box-shadow: none;
        }

        /* Estilos para el mensaje final */
        .final-message {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #991b1b;
            font-weight: normal;
            text-shadow: none;
            text-align: center;
            margin-top: 1rem;
        }

        /* --- ESTILOS DEL SOBRE 3D INICIAL --- */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease, transform 1.5s ease-in-out;
            perspective: 1200px;
        }

        .envelope-wrapper {
            position: relative;
            width: 320px; 
            height: 220px;
            cursor: pointer;
            transition: transform 0.4s ease;
            transform-style: preserve-3d;
        }

        .envelope-wrapper:hover {
            transform: translateY(-10px) scale(1.02);
        }

        .envelope-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #e2e8f0; border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .letter-paper {
            position: absolute;
            bottom: 5px; left: 5%; width: 90%; height: 95%;
            background: #fafaf9; border-radius: 5px;
            z-index: 2;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; border: 1px solid #e7e5e4;
        }

        .letter-paper h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem; color: #1e293b; margin: 0;
        }

        .letter-paper p {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem; color: #64748b; margin-top: 10px; margin-bottom: 0;
        }

        .envelope-front {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: #cbd5e1;
            clip-path: polygon(0 100%, 0 0, 50% 55%, 100% 0, 100% 100%);
            z-index: 3; border-radius: 0 0 8px 8px;
        }

        .envelope-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
            background: #94a3b8;
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
            z-index: 4; border-radius: 0 0 8px 8px;
        }

        .flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 65%;
            background: #f1f5f9;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 5;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
        }

        .wax-seal {
            position: absolute; left: 50%; bottom: 15px;
            transform: translateX(-50%);
            width: 50px; height: 50px; background: #b91c1c; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fecaca; font-family: 'Playfair Display', serif; font-size: 24px; font-style: italic; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 0 10px rgba(100,0,0,0.8);
            transition: opacity 0.3s;
        }

        .instruction-text {
            color: #94a3b8; margin-top: 50px;
            font-family: 'Poppins', sans-serif; font-size: 1rem;
            letter-spacing: 2px; text-transform: uppercase;
            animation: pulseText 2s infinite;
            transition: opacity 0.3s;
        }

        /* Animaciones al abrir el sobre */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1; /* Se esconde detrás de la carta */
        }

        .envelope-wrapper.open .wax-seal {
            opacity: 0;
        }

        .envelope-wrapper.open .letter-paper {
            transform: translateY(-130px);
            transition-delay: 0.5s; /* Sube después de que se abre la solapa */
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1.1rem; text-align: left; } /* En móvil se lee mejor a la izquierda */
            .text-panel { padding: 2rem 1.5rem; }
            button { padding: 0.6rem 1.2rem; font-size: 0.9rem; }
            .final-message { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div id="start-screen">
    <div class="envelope-wrapper" id="envelope-btn">
        <div class="envelope-bg"></div>
        <div class="letter-paper">
            <h2>Para Papá</h2>
            <p>Con mucho cariño ❤️</p>
        </div>
        <div class="envelope-front"></div>
        <div class="envelope-bottom"></div>
        <div class="flap">
            <div class="wax-seal">P</div>
        </div>
    </div>
    <div class="instruction-text" id="instruction">Haz clic en el sobre para abrir</div>
</div>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="text-panel" id="text-container">
        <div class="progress-dots" id="dots-container"></div>
        <h1 id="title-text">Querido papá,</h1>
        <div id="body-text"></div>
    </div>

    <div id="controls">
        <button id="prev-btn" disabled>Anterior</button>
        <button id="next-btn">Siguiente</button>
    </div>
</div>

<script>
    // --- DATOS DE LA CARTA ---
    const cartaData = [
        {
            title: "Querido papá",
            text: "Hoy quiero escribirte estas palabras que nacen desde lo más profundo de mi corazón, porque hay sentimientos que no siempre se dicen, pero que merecen ser expresados.",
            scene: 'intro',
            color: '#0f172a' // Slate 900
        },
        {
            title: "Gracias",
            text: "Gracias por ser ese hombre que ha caminado delante de mí abriendo senderos cuando el camino parecía incierto. Gracias por las veces que guardaste silencio para escucharme, por las veces que te cansaste trabajando para que nada faltara en casa y por cada sacrificio que hiciste sin esperar reconocimiento.",
            scene: 'path',
            color: '#1e3a8a' // Blue 900
        },
        {
            title: "Más que un padre",
            text: "Eres mucho más que un padre. Has sido <span class='highlight'>guía</span> cuando me sentí perdido, <span class='highlight'>refugio</span> cuando llegaron las tormentas, <span class='highlight'>consejo</span> cuando las decisiones parecían difíciles y <span class='highlight'>ejemplo</span> cuando necesitaba aprender el verdadero significado de la responsabilidad, la honestidad y el amor.",
            scene: 'storm',
            color: '#172554' // Blue 950
        },
        {
            title: "Tus enseñanzas",
            text: "A lo largo de la vida he comprendido que muchas de las cosas que hoy soy tienen la huella de tus enseñanzas. En tus palabras encontré sabiduría; en tus acciones encontré coherencia; y en tu amor encontré la fuerza para seguir adelante cuando las circunstancias parecían superiores a mis capacidades.",
            scene: 'wisdom',
            color: '#451a03' // Orange 950
        },
        {
            title: "Esfuerzos silenciosos",
            text: "Recuerdo tus esfuerzos silenciosos, esos que quizá nadie vio, pero que construyeron los cimientos de nuestra familia. Recuerdo tus desvelos, tus preocupaciones escondidas detrás de una sonrisa y tu manera de sostenernos incluso cuando tú mismo necesitabas apoyo.",
            scene: 'foundation',
            color: '#3f3f46' // Zinc 700
        },
        {
            title: "Un árbol fuerte",
            text: "Papá, eres como un <span class='highlight'>árbol fuerte</span> que resiste los vientos más intensos para proteger a quienes descansan bajo su sombra. Tus raíces están llenas de valores, tu tronco de fortaleza y tus ramas de generosidad.",
            scene: 'tree',
            color: '#14532d' // Green 900
        },
        {
            title: "Verdadera grandeza",
            text: "Gracias por enseñarme que la verdadera grandeza no está en el poder ni en las riquezas, sino en servir, amar y permanecer fiel a los principios.",
            scene: 'stars',
            color: '#2e1065' // Purple 900
        },
        {
            title: "Te admiro",
            text: "Hoy quiero que sepas que admiro al hombre que eres. Admiro tu perseverancia, tu valentía para enfrentar los desafíos, tu capacidad para levantarte después de cada caída y tu inmenso corazón para seguir amando aun en medio de las dificultades.",
            scene: 'heart',
            color: '#7f1d1d' // Red 900
        },
        {
            title: "Sinceramente",
            text: "Si alguna vez olvidé agradecerte, hoy lo hago con toda sinceridad. Gracias por cada abrazo, por cada corrección hecha con amor, por cada palabra de aliento, por cada oración pronunciada en silencio por mí, por cada sueño que ayudaste a construir y por cada paso que acompañaste sin pedir nada a cambio.",
            scene: 'dreams',
            color: '#064e3b' // Emerald 900
        },
        {
            title: "Mis deseos",
            text: "Que Dios te bendiga abundantemente, que recompense todo el bien que has sembrado y que te conceda salud, paz, alegría y muchos años para seguir compartiendo tu vida con quienes te amamos.",
            scene: 'blessings',
            color: '#7c2d12' // Orange 900
        },
        {
            title: "",
            text: "<p class='final-message'>Mi mayor fortuna no es lo que tengo, sino haber tenido el privilegio de llamarte papá.</p>",
            scene: 'final',
            color: '#000000' // Black
        }
    ];

    let currentStep = 0;

    // --- ELEMENTOS DEL DOM ---
    const startScreen = document.getElementById('start-screen');
    const envelopeBtn = document.getElementById('envelope-btn');
    const instructionText = document.getElementById('instruction');
    const textContainer = document.getElementById('text-container');
    const titleText = document.getElementById('title-text');
    const bodyText = document.getElementById('body-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const dotsContainer = document.getElementById('dots-container');

    // --- CONFIGURACIÓN THREE.JS ---
    let scene, camera, renderer, particles, clock;
    let currentObjects = []; // Para limpiar la escena al cambiar
    let animationId;
    let targetRotationX = 0;
    let targetRotationY = 0;
    let mouseX = 0;
    let mouseY = 0;
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    function init3D() {
        scene = new THREE.Scene();
        
        // Niebla sutil
        scene.fog = new THREE.FogExp2(0x0f172a, 0.002);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimización
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        clock = new THREE.Clock();

        // Luces generales
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0xfbbf24, 0.8);
        pointLight2.position.set(-20, -10, 10);
        scene.add(pointLight2);

        // Fondo de estrellas (siempre presente pero sutil)
        createStarsBackground();

        // Eventos
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('mousemove', onDocumentMouseMove);
        
        // Touch support para el movimiento sutil
        document.addEventListener('touchmove', onDocumentTouchMove, { passive: true });

        // Iniciar loop
        animate();
    }

    function createStarsBackground() {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        for (let i = 0; i < 2000; i++) {
            vertices.push(
                THREE.MathUtils.randFloatSpread(400),
                THREE.MathUtils.randFloatSpread(400),
                THREE.MathUtils.randFloatSpread(400)
            );
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 0.5,
            transparent: true,
            opacity: 0.4
        });
        particles = new THREE.Points(geometry, material);
        scene.add(particles);
    }

    //    
    // Limpiar objetos anteriores
    function clearCurrentObjects() {
        currentObjects.forEach(obj => {
            if(obj.geometry) obj.geometry.dispose();
            if(obj.material) {
                if(Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                else obj.material.dispose();
            }
            scene.remove(obj);
        });
        currentObjects = [];
    }

    // Escena 1: Introducción (Partículas cálidas flotantes)
    function createIntroScene() {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const colors = [];
        const colorPalette = [new THREE.Color(0xfbbf24), new THREE.Color(0xf59e0b), new THREE.Color(0xffedd5)];

        for (let i = 0; i < 500; i++) {
            vertices.push(
                THREE.MathUtils.randFloatSpread(100),
                THREE.MathUtils.randFloatSpread(100),
                THREE.MathUtils.randFloatSpread(100)
            );
            const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors.push(c.r, c.g, c.b);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 1.5,
            vertexColors: true,
            transparent: true,
            opacity: 0, // Inicia invisible para fade in
            blending: THREE.AdditiveBlending
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);
        currentObjects.push(points);

        // Animación personalizada
        points.userData.update = (time) => {
            points.rotation.y = time * 0.05;
            points.rotation.x = time * 0.02;
        };

        gsap.to(material, { opacity: 0.8, duration: 2 });
    }

    // Escena 2: Camino (Un sendero de esferas brillantes)
    function createPathScene() {
        const pathGroup = new THREE.Group();
        
        for(let i = 0; i < 30; i++) {
            const geometry = new THREE.SphereGeometry(Math.random() * 0.8 + 0.2, 16, 16);
            const material = new THREE.MeshPhongMaterial({
                color: 0x60a5fa, // Blue 400
                emissive: 0x2563eb,
                emissiveIntensity: 0.5,
                shininess: 100,
                transparent: true,
                opacity: 0
            });
            const sphere = new THREE.Mesh(geometry, material);
            
            // Posicionar como un camino sinuoso hacia la cámara
            sphere.position.set(
                Math.sin(i * 0.5) * 10,
                -10 + i * 0.8, // Sube
                -50 + i * 2    // Viene de lejos
            );
            
            pathGroup.add(sphere);
            
            gsap.to(material, { opacity: 1, duration: 1, delay: i * 0.05 });
        }
        
        scene.add(pathGroup);
        currentObjects.push(pathGroup);

        pathGroup.userData.update = (time) => {
            pathGroup.children.forEach((child, i) => {
                child.position.y += Math.sin(time * 2 + i) * 0.02;
            });
        };
    }

    // Escena 3: Refugio/Tormenta (Geometría abstracta protectora)
    function createStormScene() {
        const group = new THREE.Group();

        // Paragüas/Escudo abstracto
        const geoShield = new THREE.TorusGeometry(15, 0.5, 16, 100, Math.PI);
        const matShield = new THREE.MeshPhysicalMaterial({
            color: 0x38bdf8,
            metalness: 0.2,
            roughness: 0.1,
            transmission: 0.9,
            transparent: true,
            opacity: 0
        });
        const shield = new THREE.Mesh(geoShield, matShield);
        shield.rotation.x = Math.PI / 2;
        shield.position.y = 5;
        group.add(shield);

        // "Lluvia" o tormenta alrededor
        const geoRain = new THREE.BufferGeometry();
        const rainVerts = [];
        for(let i=0; i<800; i++) {
            rainVerts.push(
                THREE.MathUtils.randFloatSpread(60),
                Math.random() * 40,
                THREE.MathUtils.randFloatSpread(60)
            );
        }
        geoRain.setAttribute('position', new THREE.Float32BufferAttribute(rainVerts, 3));
        const matRain = new THREE.PointsMaterial({color: 0x94a3b8, size: 0.2, transparent: true, opacity:0});
        const rain = new THREE.Points(geoRain, matRain);
        group.add(rain);

        scene.add(group);
        currentObjects.push(group, matShield, matRain);

        gsap.to(matShield, {opacity: 1, duration: 2});
        gsap.to(matRain, {opacity: 0.4, duration: 2});

        group.userData.update = (time) => {
            shield.rotation.z = time * 0.2;
            // Animar lluvia cayendo
            const positions = rain.geometry.attributes.position.array;
            for(let i = 1; i < positions.length; i+=3) {
                positions[i] -= 0.5;
                if(positions[i] < -20) positions[i] = 40;
            }
            rain.geometry.attributes.position.needsUpdate = true;
        };
    }

    // Escena 4: Sabiduría (Libro o figuras geométricas ascendentes)
    function createWisdomScene() {
        const group = new THREE.Group();
        
        for(let i=0; i<15; i++) {
            const geo = new THREE.OctahedronGeometry(Math.random() * 2 + 1);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xfde047, // Yellow 300
                wireframe: true,
                transparent: true,
                opacity: 0
            });
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.position.set(
                THREE.MathUtils.randFloatSpread(30),
                THREE.MathUtils.randFloatSpread(30),
                THREE.MathUtils.randFloatSpread(20) - 10
            );
            
            // Velocidades aleatorias
            mesh.userData = {
                rx: Math.random() * 0.02,
                ry: Math.random() * 0.02,
                vy: Math.random() * 0.05 + 0.02
            };
            
            group.add(mesh);
            gsap.to(mat, {opacity: 0.6, duration: 2, delay: i * 0.1});
        }
        
        scene.add(group);
        currentObjects.push(group);

        group.userData.update = () => {
            group.children.forEach(child => {
                child.rotation.x += child.userData.rx;
                child.rotation.y += child.userData.ry;
                child.position.y += child.userData.vy;
                if(child.position.y > 20) child.position.y = -20;
            });
        };
    }

    //    // Escena 6: Árbol (Generación procedural básica)
    function createTreeScene() {
        const treeGroup = new THREE.Group();

        // Materiales
        const trunkMat = new THREE.MeshStandardMaterial({ 
            color: 0x78350f, // Amber 900
            roughness: 0.9,
            transparent: true,
            opacity: 0
        });
        const leafMat = new THREE.MeshStandardMaterial({ 
            color: 0x22c55e, // Green 500
            roughness: 0.6,
            transparent: true,
            opacity: 0
        });

        // Tronco principal
        const trunkGeo = new THREE.CylinderGeometry(1, 2, 10, 8);
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = -5;
        treeGroup.add(trunk);

        // Función recursiva para ramas simples
        function createBranch(parentPos, length, radius, angleX, angleZ, level) {
            if (level === 0) return;

            const branchGeo = new THREE.CylinderGeometry(radius*0.7, radius, length, 8);
            // Mover el pivote a la base del cilindro
            branchGeo.translate(0, length/2, 0); 
            const branch = new THREE.Mesh(branchGeo, trunkMat);
            
            branch.position.copy(parentPos);
            branch.rotation.x = angleX;
            branch.rotation.z = angleZ;

            treeGroup.add(branch);

            // Calcular punta de la rama
            const endPos = new THREE.Vector3(0, length, 0);
            endPos.applyEuler(branch.rotation);
            endPos.add(branch.position);

            // Agregar hojas si es el último nivel o penúltimo
            if(level <= 2) {
                const leafGeo = new THREE.DodecahedronGeometry(Math.random() * 2 + 1.5);
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.copy(endPos);
                treeGroup.add(leaf);
            }

            // Ramificar
            createBranch(endPos, length * 0.7, radius * 0.7, angleX + 0.5, angleZ + 0.5, level - 1);
            createBranch(endPos, length * 0.7, radius * 0.7, angleX - 0.5, angleZ - 0.5, level - 1);
            if(Math.random() > 0.3) createBranch(endPos, length * 0.6, radius * 0.6, angleX + 0.3, angleZ - 0.6, level - 1);
        }

        createBranch(new THREE.Vector3(0, 0, 0), 6, 1.2, 0.2, 0.3, 3);
        createBranch(new THREE.Vector3(0, 0, 0), 5, 1.0, -0.3, -0.2, 3);

        // Escalar de 0 a 1
        treeGroup.scale.set(0.01, 0.01, 0.01);
        scene.add(treeGroup);
        currentObjects.push(treeGroup, trunkMat, leafMat);

        gsap.to(treeGroup.scale, { x: 1, y: 1, z: 1, duration: 3, ease: "elastic.out(1, 0.5)" });
        gsap.to(trunkMat, { opacity: 1, duration: 2 });
        gsap.to(leafMat, { opacity: 0.9, duration: 2, delay: 0.5 });

        treeGroup.userData.update = (time) => {
            treeGroup.rotation.y = Math.sin(time * 0.2) * 0.1; // Suave balanceo
        };
    }

    // Escena 8: Corazón (Admiración y Amor)
    function createHeartScene() {
        const x = 0, y = 0;
        const heartShape = new THREE.Shape();

        // Fórmula paramétrica del corazón
        heartShape.moveTo( x + 5, y + 5 );
        heartShape.bezierCurveTo( x + 5, y + 5, x + 4, y, x, y );
        heartShape.bezierCurveTo( x - 6, y, x - 6, y + 7,x - 6, y + 7 );
        heartShape.bezierCurveTo( x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19 );
        heartShape.bezierCurveTo( x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7 );
        heartShape.bezierCurveTo( x + 16, y + 7, x + 16, y, x + 10, y );
        heartShape.bezierCurveTo( x + 7, y, x + 5, y + 5, x + 5, y + 5 );

        const geometry = new THREE.ShapeGeometry( heartShape );
        // Centrar geometría
        geometry.computeBoundingBox();
        const xOffset = -0.5 * ( geometry.boundingBox.max.x - geometry.boundingBox.min.x );
        const yOffset = -0.5 * ( geometry.boundingBox.max.y - geometry.boundingBox.min.y );
        geometry.translate( xOffset, yOffset, 0 );
        // Invertir Y porque el shape se dibuja al revés en 3D
        geometry.rotateZ(Math.PI);

        // Crear partículas a lo largo de la forma
        const points = geometry.attributes.position.array;
        const particleGeo = new THREE.BufferGeometry();
        const particleMat = new THREE.PointsMaterial({
            color: 0xef4444, // Red 500
            size: 0.5,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
        });

        // Duplicar y esparcir puntos para dar volumen
        const volPoints = [];
        for(let i=0; i<points.length; i+=3) {
            for(let j=0; j<5; j++){ // 5 partículas por vértice original
                volPoints.push(
                    points[i] + THREE.MathUtils.randFloatSpread(2),
                    points[i+1] + THREE.MathUtils.randFloatSpread(2),
                    THREE.MathUtils.randFloatSpread(4)
                );
            }
        }
        
        particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(volPoints, 3));
        const heart = new THREE.Points(particleGeo, particleMat);
        heart.scale.set(0.5, 0.5, 0.5); // Ajustar tamaño

        scene.add(heart);
        currentObjects.push(heart, particleMat);

        gsap.to(particleMat, {opacity: 1, duration: 2});
        
        // Animación de latido
        heart.userData.update = (time) => {
            const scale = 0.5 + Math.sin(time * 5) * 0.05; // Latido rápido
            heart.scale.set(scale, scale, scale);
            heart.rotation.y = Math.sin(time) * 0.2;
        };
    }

    // Escena Final: Galaxia de agradecimiento
    function createFinalScene() {
        const group = new THREE.Group();
        
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const colors = [];
        const colorPalette = [0xfbbf24, 0xef4444, 0x3b82f6, 0xffffff];

        for ( let i = 0; i < 3000; i ++ ) {
            const x = THREE.MathUtils.randFloatSpread( 100 );
            const y = THREE.MathUtils.randFloatSpread( 100 );
            const z = THREE.MathUtils.randFloatSpread( 100 );
            
            // Hacer que formen una esfera
            const vector = new THREE.Vector3(x,y,z);
            vector.normalize().multiplyScalar(Math.random() * 40 + 10);

            vertices.push( vector.x, vector.y, vector.z );

            const color = new THREE.Color(colorPalette[Math.floor(Math.random() * colorPalette.length)]);
            colors.push(color.r, color.g, color.b);
        }

        geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
        geometry.setAttribute( 'color', new THREE.Float32BufferAttribute( colors, 3 ) );

        const material = new THREE.PointsMaterial( { 
            size: 0.8, 
            vertexColors: true,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
        } );

        const galaxy = new THREE.Points( geometry, material );
        group.add(galaxy);
        scene.add(group);
        currentObjects.push(group);

        gsap.to(material, {opacity: 1, duration: 3});

        group.userData.update = (time) => {
            group.rotation.y = time * 0.1;
            group.rotation.x = time * 0.05;
        };
    }

    function loadSceneData(sceneName) {
        clearCurrentObjects();
        
        switch(sceneName) {
            case 'intro': createIntroScene(); break;
            case 'path': createPathScene(); break;
            case 'storm': createStormScene(); break;
            case 'wisdom': createWisdomScene(); break;
            case 'tree': createTreeScene(); break;
            case 'heart': createHeartScene(); break;
            case 'final': createFinalScene(); break;
            // Escenas por defecto si no hay una específica
            default: createIntroScene(); break;
        }
    }

    // --- ANIMACIÓN PRINCIPAL ---
    function animate() {
        animationId = requestAnimationFrame(animate);

        const time = clock.getElapsedTime();

        // Actualizar partículas de fondo suavemente
        if(particles) {
            particles.rotation.y = time * 0.02;
        }

        // Interacción suave con el mouse
        targetRotationX = (mouseY * 0.001);
        targetRotationY = (mouseX * 0.001);
        
        camera.position.x += (mouseX * 0.01 - camera.position.x) * 0.05;
        camera.position.y += (-mouseY * 0.01 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        // Actualizar objetos específicos de la escena
        currentObjects.forEach(obj => {
            if(obj.userData && obj.userData.update) {
                obj.userData.update(time);
            }
        });

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onDocumentMouseMove(event) {
        mouseX = (event.clientX - windowHalfX);
        mouseY = (event.clientY - windowHalfY);
    }

    function onDocumentTouchMove(event) {
        if(event.touches.length === 1) {
            mouseX = event.touches[0].pageX - windowHalfX;
            mouseY = event.touches[0].pageY - windowHalfY;
        }
    }

    //    
    function createDots() {
        dotsContainer.innerHTML = '';
        cartaData.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (index === 0) dot.classList.add('active');
            // Opcional: hacer los dots clickeables
            dot.addEventListener('click', () => updateCarta(index));
            dotsContainer.appendChild(dot);
        });
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            if (index === currentStep) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        });
    }

    function updateCarta(index) {
        if (index < 0 || index >= cartaData.length) return;
        
        const isFinal = index === cartaData.length - 1;

        // Ocultar texto actual
        gsap.to(textContainer, {
            opacity: 0, 
            y: -20, 
            duration: 0.5, 
            onComplete: () => {
                currentStep = index;
                const data = cartaData[currentStep];

                // Actualizar contenido
                titleText.innerHTML = data.title;
                if(data.title === "") {
                    titleText.style.display = 'none';
                } else {
                    titleText.style.display = 'block';
                }
                
                bodyText.innerHTML = `<p>${data.text}</p>`;

                // Cambiar color de fondo
                document.body.style.backgroundColor = data.color;
                if(scene && scene.fog) {
                    scene.fog.color.set(data.color);
                }

                // Cargar nueva escena 3D
                loadSceneData(data.scene);

                // Actualizar botones
                prevBtn.disabled = currentStep === 0;
                
                if (isFinal) {
                    nextBtn.style.display = 'none'; // Ocultar en el último paso
                    dotsContainer.style.display = 'none';
                    // Mantener la estética de papel al final
                    textContainer.style.background = '#fdfaf6';
                    textContainer.style.backgroundImage = 'url("data:image/svg+xml,%3Csvg width=\'100\' height=\'100\' viewBox=\'0 0 100 100\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noise\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100\' height=\'100\' filter=\'url(%23noise)\' opacity=\'0.06\'/%3E%3C/svg%3E")';
                    textContainer.style.border = '1px solid #d6d3d1';
                } else {
                    nextBtn.style.display = 'block';
                    nextBtn.innerText = 'Siguiente';
                    dotsContainer.style.display = 'flex';
                    // Restaurar propiedades de papel
                    textContainer.style.background = '#fdfaf6';
                    textContainer.style.backgroundImage = 'url("data:image/svg+xml,%3Csvg width=\'100\' height=\'100\' viewBox=\'0 0 100 100\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noise\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100\' height=\'100\' filter=\'url(%23noise)\' opacity=\'0.06\'/%3E%3C/svg%3E")';
                    textContainer.style.border = '1px solid #d6d3d1';
                }

                updateDots();

                // Mostrar nuevo texto
                gsap.fromTo(textContainer, 
                    {opacity: 0, y: 30}, 
                    {opacity: 1, y: 0, duration: 1, ease: "power2.out"}
                );
            }
        });
    }

    // Event Listeners de Botones
    prevBtn.addEventListener('click', () => updateCarta(currentStep - 1));
    nextBtn.addEventListener('click', () => updateCarta(currentStep + 1));

    envelopeBtn.addEventListener('click', () => {
        // 1. Iniciar animación de abrir sobre
        envelopeBtn.classList.add('open');
        instructionText.style.opacity = '0';
        envelopeBtn.style.pointerEvents = 'none'; // Evitar doble click
        
        // 2. Esperar a que la carta salga y luego hacer transición al 3D
        setTimeout(() => {
            // Efecto inmersivo: nos acercamos a la carta
            startScreen.style.transform = 'scale(4) translateY(50px)';
            startScreen.style.opacity = '0';
            
            // 3. Cuando termina el fade out, mostramos la escena principal
            setTimeout(() => {
                startScreen.style.display = 'none';
                init3D();
                createDots();
                updateCarta(0);
            }, 1000);
        }, 1800); // Dar tiempo a que el sobre termine su animación visual
    });

</script>
