<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Papá</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #1c1917; /* Texto principal oscuro para el papel */
            font-family: 'Poppins', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #ambient-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            background-color: #0f172a; /* Fondo azul unificado */
            transition: background-color 2s ease;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.7;
            transition: background-color 2s ease;
        }

        /* Colores unificados de "amanecer/camino" para todas las escenas */
        .blob-1 {
            width: 60vw; height: 60vw;
            top: -20%; left: -10%;
            background-color: #0284c7;
            animation: float1 25s infinite ease-in-out;
        }

        .blob-2 {
            width: 50vw; height: 50vw;
            bottom: -20%; right: -10%;
            background-color: #3b82f6;
            animation: float2 20s infinite ease-in-out reverse;
        }

        .blob-3 {
            width: 70vw; height: 70vw;
            top: 20%; left: 20%;
            background-color: #172554;
            animation: float3 30s infinite ease-in-out;
        }

        @keyframes float1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(10%, 10%) scale(1.1); } }
        @keyframes float2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-10%, -10%) scale(1.05); } }
        @keyframes float3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(5%, -15%) scale(1.15); } }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        #ui-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none; /* Hasta que inicie */
        }

        /* Estilo de la carta física */
        .text-panel {
            background-color: #fdfaf6;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            padding: 3rem 4rem;
            border-radius: 8px;
            max-width: 700px;
            width: 85%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255,255,255,0.1);
            position: relative;
            border: 1px solid rgba(0,0,0,0.05);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1c1917;
            font-weight: 700;
        }

        p {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 0;
            color: #292524;
            text-align: justify;
        }

        .highlight {
            color: #9f1239; /* Rojo tinto para destacar */
            font-style: italic;
            font-weight: 700;
        }

        .final-message {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            text-align: center;
            color: #1c1917;
            margin-top: 1rem;
            line-height: 1.4;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        button {
            background-color: transparent;
            color: #1c1917;
            border: 1px solid #1c1917;
            padding: 0.6rem 1.5rem;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        button:hover {
            background-color: #1c1917;
            color: #fdfaf6;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background-color: transparent;
            color: #1c1917;
        }

        .dots { display: flex; gap: 8px; }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: rgba(28, 25, 23, 0.3);
            transition: all 0.3s ease;
        }
        .dot.active {
            background-color: #1c1917;
            transform: scale(1.3);
        }

        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
        }

        .intro-title {
            color: #f8fafc;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.8rem;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            opacity: 0.9;
        }

        .intro-hint {
            color: #cbd5e1;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 40px;
            animation: pulseHint 2s infinite;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Contenedor del sobre */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            animation: floatEnvelope 4s ease-in-out infinite;
        }

        @keyframes floatEnvelope {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .envelope {
            width: 300px;
            height: 200px;
            background-color: #e2e8f0;
            position: relative;
            border-radius: 5px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.1);
            perspective: 1000px;
        }

        .envelope-front {
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 100px 150px;
            border-color: transparent #cbd5e1 #94a3b8 #cbd5e1;
            border-radius: 0 0 5px 5px;
            z-index: 3;
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 100px 150px;
            border-color: #f1f5f9 transparent transparent transparent;
            transform-origin: top;
            z-index: 4;
            transition: transform 0.6s ease-in-out;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
        }

        .wax-seal {
            position: absolute;
            bottom: -20px;
            left: calc(50% - 25px);
            width: 50px; height: 50px;
            background: radial-gradient(circle at 30% 30%, #f43f5e, #be123c, #881337);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fca5a5;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            transition: opacity 0.3s ease;
        }

        .wax-seal::after {
            content: '';
            position: absolute;
            width: 40px; height: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
        }

        .letter-inside {
            position: absolute;
            bottom: 10px; left: 10px;
            width: 280px; height: 180px;
            background-color: #fdfaf6;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 4px;
            transition: transform 0.8s ease-in-out 0.3s;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
        }

        .letter-inside h2 {
            font-family: 'Dancing Script', cursive;
            color: #1c1917;
            margin: 0;
            font-size: 2rem;
        }

        /* Efecto destello mágico al abrir */
        #magic-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            background: radial-gradient(circle, #fff, #fef08a, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1.1rem; text-align: left; }
            .text-panel { padding: 2rem 1.5rem; width: 90%; }
            button { padding: 0.6rem 1.2rem; font-size: 0.9rem; }
            .final-message { font-size: 2.2rem; }
            .blob { filter: blur(80px); }
            .blob-1 { width: 100vw; height: 100vw; }
            .blob-2 { width: 90vw; height: 90vw; }
            .blob-3 { width: 120vw; height: 120vw; }
            .intro-title { font-size: 1.4rem; text-align: center; padding: 0 20px; }
        }
    </style>
</head>
<body>

<div id="ambient-bg">
    <div class="blob blob-1" id="b1"></div>
    <div class="blob blob-2" id="b2"></div>
    <div class="blob blob-3" id="b3"></div>
</div>

<div id="start-screen">
    <div class="intro-title">Para la persona que me enseñó a volar...</div>
    
    <div class="envelope-wrapper" id="envelope-btn">
        <div class="envelope">
            <div class="envelope-flap" id="flap"></div>
            <div class="wax-seal" id="seal">P</div>
            <div class="letter-inside" id="inner-letter">
                <h2>Para Papá</h2>
                <span style="font-family: 'Playfair Display'; font-style: italic; font-size: 0.9rem; margin-top: 10px; color: #57534e;">Con mucho cariño</span>
            </div>
            <div class="envelope-front"></div>
        </div>
        <div id="magic-glow"></div>
    </div>

    <div class="intro-hint">Toca el sobre para abrir</div>
</div>

<div id="canvas-container"></div>

<div id="ui-container">
    <div class="text-panel" id="text-panel">
        <h1 id="title-text">Querido papá</h1>
        <div id="body-text">
            <p>...</p>
        </div>
        
        <div class="controls">
            <button id="prev-btn" disabled>Anterior</button>
            <div class="dots" id="dots-container"></div>
            <button id="next-btn">Siguiente</button>
        </div>
    </div>
</div>

<script>
    const cartaData = [
        {
            title: "Querido papá",
            text: "Hoy quiero escribirte estas palabras que nacen desde lo más profundo de mi corazón, porque hay sentimientos que no siempre se dicen, pero que merecen ser expresados.",
            scene: 'intro'
        },
        {
            title: "Gracias",
            text: "Gracias por ser ese hombre que ha caminado delante de mí abriendo senderos cuando el camino parecía incierto. Gracias por las veces que guardaste silencio para escucharme, por las veces que te cansaste trabajando para que nada faltara en casa y por cada sacrificio que hiciste sin esperar reconocimiento.",
            scene: 'path'
        },
        {
            title: "Más que un padre",
            text: "Eres mucho más que un padre. Has sido <span class='highlight'>guía</span> cuando me sentí perdido, <span class='highlight'>refugio</span> cuando llegaron las tormentas, <span class='highlight'>consejo</span> cuando las decisiones parecían difíciles y <span class='highlight'>ejemplo</span> cuando necesitaba aprender el verdadero significado de la responsabilidad, la honestidad y el amor.",
            scene: 'storm'
        },
        {
            title: "Tus enseñanzas",
            text: "A lo largo de la vida he comprendido que muchas de las cosas que hoy soy tienen la huella de tus enseñanzas. En tus palabras encontré sabiduría; en tus acciones encontré coherencia; y en tu amor encontré la fuerza para seguir adelante cuando las circunstancias parecían superiores a mis capacidades.",
            scene: 'wisdom'
        },
        {
            title: "Esfuerzos silenciosos",
            text: "Recuerdo tus esfuerzos silenciosos, esos que quizá nadie vio, pero que construyeron los cimientos de nuestra familia. Recuerdo tus desvelos, tus preocupaciones escondidas detrás de una sonrisa y tu manera de sostenernos incluso cuando tú mismo necesitabas apoyo.",
            scene: 'foundation'
        },
        {
            title: "Un árbol fuerte",
            text: "Papá, eres como un <span class='highlight'>árbol fuerte</span> que resiste los vientos más intensos para proteger a quienes descansan bajo su sombra. Tus raíces están llenas de valores, tu tronco de fortaleza y tus ramas de generosidad.",
            scene: 'tree'
        },
        {
            title: "Verdadera grandeza",
            text: "Gracias por enseñarme que la verdadera grandeza no está en el poder ni en las riquezas, sino en servir, amar y permanecer fiel a los principios.",
            scene: 'stars'
        },
        {
            title: "Te admiro",
            text: "Hoy quiero que sepas que admiro al hombre que eres. Admiro tu perseverancia, tu valentía para enfrentar los desafíos, tu capacidad para levantarte después de cada caída y tu inmenso corazón para seguir amando aun en medio de las dificultades.",
            scene: 'heart'
        },
        {
            title: "Sinceramente",
            text: "Si alguna vez olvidé agradecerte, hoy lo hago con toda sinceridad. Gracias por cada abrazo, por cada corrección hecha con amor, por cada palabra de aliento, por cada oración pronunciada en silencio por mí, por cada sueño que ayudaste a construir y por cada paso que acompañaste sin pedir nada a cambio.",
            scene: 'dreams'
        },
        {
            title: "Mis deseos",
            text: "Que Dios te bendiga abundantemente, que recompense todo el bien que has sembrado y que te conceda salud, paz, alegría y muchos años para seguir compartiendo tu vida con quienes te amamos.",
            scene: 'blessings'
        },
        {
            title: "",
            text: "<p class='final-message'>Mi mayor fortuna no es lo que tengo, sino haber tenido el privilegio de llamarte papá.</p>",
            scene: 'final'
        }
    ];

    let currentStep = 0;
    
    // Referencias DOM
    const startScreen = document.getElementById('start-screen');
    const uiContainer = document.getElementById('ui-container');
    const textPanel = document.getElementById('text-panel');
    const titleText = document.getElementById('title-text');
    const bodyText = document.getElementById('body-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const dotsContainer = document.getElementById('dots-container');

    const envelopeBtn = document.getElementById('envelope-btn');
    const flap = document.getElementById('flap');
    const seal = document.getElementById('seal');
    const innerLetter = document.getElementById('inner-letter');
    const magicGlow = document.getElementById('magic-glow');

    envelopeBtn.addEventListener('click', () => {
        // Evitar múltiples clics
        envelopeBtn.style.pointerEvents = 'none';

        // 1. Ocultar el sello
        seal.style.opacity = '0';

        // 2. Abrir la solapa
        setTimeout(() => {
            flap.style.transform = 'rotateX(180deg)';
            flap.style.zIndex = '1';
        }, 100);

        // 3. Sacar la carta
        setTimeout(() => {
            innerLetter.style.transform = 'translateY(-120px) scale(1.1)';
            innerLetter.style.zIndex = '6';
        }, 500);

        // 4. Destello mágico
        setTimeout(() => {
            gsap.to(magicGlow, {
                opacity: 1,
                scale: 100,
                duration: 1.5,
                ease: "power2.inOut"
            });
        }, 1500);

        // 5. Transición a la escena 3D principal
        setTimeout(() => {
            gsap.to(startScreen, {
                opacity: 0,
                duration: 1,
                onComplete: () => {
                    startScreen.style.display = 'none';
                    uiContainer.style.pointerEvents = 'auto';
                    
                    // Mostrar UI de la carta
                    gsap.to(uiContainer, { opacity: 1, duration: 1 });
                    
                    // Iniciar la experiencia interactiva
                    init3D();
                    setupUI();
                    updateCarta(0);
                }
            });
        }, 2200);
    });

    function setupUI() {
        // Crear puntos de progreso
        cartaData.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        });

        prevBtn.addEventListener('click', () => updateCarta(currentStep - 1));
        nextBtn.addEventListener('click', () => updateCarta(currentStep + 1));
    }

    function updateCarta(index) {
        if (index < 0 || index >= cartaData.length) return;
        
        const isFinal = index === cartaData.length - 1;

        // Animar salida del texto actual
        gsap.to(textPanel, {
            opacity: 0, 
            y: 20, 
            duration: 0.4, 
            onComplete: () => {
                currentStep = index;
                const data = cartaData[currentStep];

                // Actualizar contenido de texto
                titleText.innerHTML = data.title;
                titleText.style.display = data.title === "" ? 'none' : 'block';
                bodyText.innerHTML = `<p>${data.text}</p>`;

                // Cargar nueva escena 3D asociada
                loadSceneData(data.scene);

                // Actualizar estado de botones
                prevBtn.disabled = currentStep === 0;
                nextBtn.innerHTML = isFinal ? "Volver a leer" : "Siguiente";
                if(isFinal) {
                    nextBtn.onclick = () => updateCarta(0);
                } else {
                    nextBtn.onclick = () => updateCarta(currentStep + 1);
                }

                // Actualizar puntos de progreso
                document.querySelectorAll('.dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentStep);
                });

                // Animar entrada del nuevo texto
                gsap.to(textPanel, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.2)" });
            }
        });
    }

    let scene, camera, renderer;
    let currentObjects = []; // Almacena los objetos 3D de la escena actual
    let animationFrameId;

    function init3D() {
        const container = document.getElementById('canvas-container');
        
        // Crear Escena
        scene = new THREE.Scene();
        // Niebla suave para darle profundidad (color azul oscuro unificado)
        scene.fog = new THREE.FogExp2('#0f172a', 0.002);

        // Cámara
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;
        camera.position.y = 5;

        // Renderizador con fondo transparente para dejar ver las auroras CSS
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // Eventos
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('mousemove', onMouseMove);

        // Iniciar loop de animación
        animate();
    }

    // Interacción suave con el mouse
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    function onMouseMove(event) {
        mouseX = (event.clientX - windowHalfX) * 0.05;
        mouseY = (event.clientY - windowHalfY) * 0.05;
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function clearScene() {
        currentObjects.forEach(obj => {
            scene.remove(obj);
            if(obj.geometry) obj.geometry.dispose();
            if(obj.material) obj.material.dispose();
        });
        currentObjects = [];
    }

    // Generador de partículas auxiliar
    function createParticleSystem(color, count, size, spread) {
        const geometry = new THREE.BufferGeometry();
        const positions = [];
        for (let i = 0; i < count; i++) {
            positions.push(
                (Math.random() - 0.5) * spread,
                (Math.random() - 0.5) * spread,
                (Math.random() - 0.5) * spread
            );
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
            color: color,
            size: size,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);
        currentObjects.push(particles);
        return particles;
    }

    function loadSceneData(sceneName) {
        clearScene();

        switch(sceneName) {
            case 'intro':
                // Partículas doradas flotantes
                const introParticles = createParticleSystem(0xffd700, 500, 0.2, 50);
                introParticles.userData = { 
                    update: () => { introParticles.rotation.y += 0.002; introParticles.rotation.x += 0.001; } 
                };
                break;

            case 'path':
                // Sendero de luz
                const pathGeo = new THREE.BufferGeometry();
                const pathPos = [];
                for(let i=0; i<200; i++) {
                    pathPos.push(
                        (Math.random() - 0.5) * 10,
                        -10 + (Math.random() * 2),
                        -50 + (i * 0.5)
                    );
                }
                pathGeo.setAttribute('position', new THREE.Float32BufferAttribute(pathPos, 3));
                const pathMat = new THREE.PointsMaterial({ color: 0x60a5fa, size: 0.3 });
                const path = new THREE.Points(pathGeo, pathMat);
                scene.add(path);
                currentObjects.push(path);
                path.userData = { update: () => { path.position.z += 0.1; if(path.position.z > 20) path.position.z = 0; } };
                break;

            case 'storm':
                // Lluvia/Tormenta (pero protegida en el centro)
                const rain = createParticleSystem(0x93c5fd, 1000, 0.1, 60);
                rain.userData = { 
                    update: () => {
                        const positions = rain.geometry.attributes.position.array;
                        for(let i=1; i<positions.length; i+=3) {
                            positions[i] -= 0.5; // Caída
                            if(positions[i] < -20) positions[i] = 20;
                            // Evitar el centro (refugio)
                            if(Math.abs(positions[i-1]) < 5 && positions[i] < 10) positions[i-1] += (Math.random() > 0.5 ? 2 : -2);
                        }
                        rain.geometry.attributes.position.needsUpdate = true;
                    } 
                };
                break;

            case 'wisdom':
                // Orbes ascendentes (Sabiduría)
                const orbs = createParticleSystem(0xfcd34d, 150, 0.5, 40);
                orbs.userData = {
                    update: () => {
                        const pos = orbs.geometry.attributes.position.array;
                        for(let i=1; i<pos.length; i+=3) {
                            pos[i] += 0.05; // Ascender
                            if(pos[i] > 20) pos[i] = -20;
                        }
                        orbs.geometry.attributes.position.needsUpdate = true;
                        orbs.rotation.y += 0.001;
                    }
                };
                break;

            case 'tree':
                // Abstracto: Árbol formado por esferas ascendentes
                const trunkGeo = new THREE.CylinderGeometry(1, 1.5, 10, 8);
                const trunkMat = new THREE.MeshLambertMaterial({ color: 0x451a03, wireframe: true });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = -5;
                scene.add(trunk);
                currentObjects.push(trunk);

                const leavesGeo = new THREE.SphereGeometry(6, 16, 16);
                const leavesMat = new THREE.MeshLambertMaterial({ color: 0x15803d, wireframe: true, transparent: true, opacity: 0.5 });
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 2;
                scene.add(leaves);
                currentObjects.push(leaves);

                const treeParticles = createParticleSystem(0x22c55e, 200, 0.2, 15);
                treeParticles.position.y = 2;
                
                trunk.userData = { update: () => { trunk.rotation.y += 0.005; leaves.rotation.y -= 0.003; treeParticles.rotation.y += 0.01; } };
                break;

            case 'heart':
                // Corazón abstracto
                const heartParticlesGeo = new THREE.BufferGeometry();
                const heartPos = [];
                for (let i = 0; i < 300; i++) {
                    const t = Math.PI * 2 * Math.random();
                    const r = 0.5 + Math.random() * 0.5;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    heartPos.push(x * r * 0.5, y * r * 0.5, (Math.random() - 0.5) * 5);
                }
                heartParticlesGeo.setAttribute('position', new THREE.Float32BufferAttribute(heartPos, 3));
                const heartMat = new THREE.PointsMaterial({ color: 0xe11d48, size: 0.3, blending: THREE.AdditiveBlending });
                const heart = new THREE.Points(heartParticlesGeo, heartMat);
                scene.add(heart);
                currentObjects.push(heart);
                
                let scalePhase = 0;
                heart.userData = { 
                    update: () => {
                        scalePhase += 0.05;
                        const scale = 1 + Math.sin(scalePhase) * 0.1; // Latido
                        heart.scale.set(scale, scale, scale);
                        heart.rotation.y = Math.sin(scalePhase * 0.2) * 0.2;
                    } 
                };
                break;

            case 'stars':
            case 'final':
                // Galaxia inmersiva
                const galaxy = createParticleSystem(0xffffff, 2000, 0.15, 80);
                galaxy.userData = { 
                    update: () => { 
                        galaxy.rotation.y += 0.001; 
                        galaxy.rotation.z += 0.0005; 
                    } 
                };
                break;
                
            default:
                // Escena por defecto (estrellas suaves)
                const defParticles = createParticleSystem(0xffffff, 300, 0.1, 40);
                defParticles.userData = { update: () => { defParticles.rotation.y -= 0.001; } };
                break;
        }
    }

    function animate() {
        animationFrameId = requestAnimationFrame(animate);

        // Suavizar movimiento de cámara basado en el mouse
        targetX = mouseX * 2;
        targetY = mouseY * 2;
        camera.position.x += (targetX - camera.position.x) * 0.02;
        camera.position.y += (-targetY - camera.position.y + 5) * 0.02;
        camera.lookAt(scene.position);

        // Actualizar objetos específicos de la escena
        currentObjects.forEach(obj => {
            if(obj.userData && obj.userData.update) {
                obj.userData.update();
            }
        });

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
